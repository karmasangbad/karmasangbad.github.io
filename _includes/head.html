<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.summary %}{{ page.summary }}{% else %}{{ site.description }}{% endif %}">
  
  <!-- Bengali Google Fonts: Hind Siliguri & Noto Sans Bengali -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            bengali: ['"Hind Siliguri"', '"Noto Sans Bengali"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Styles -->
  <style>
    body {
      font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif;
    }
    .job-content h2 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1e293b;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 0.35rem;
    }
    .job-content h3 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #334155;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
    }
    .job-content ul, .job-content ol {
      margin-left: 1.5rem;
      margin-bottom: 1rem;
    }
    .job-content ul {
      list-style-type: disc;
    }
    .job-content ol {
      list-style-type: decimal;
    }
    .job-content li {
      margin-bottom: 0.4rem;
      line-height: 1.7;
    }
    .job-content p {
      line-height: 1.75;
      margin-bottom: 0.85rem;
    }
    .job-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.25rem 0;
    }
    .job-content th, .job-content td {
      border: 1px solid #cbd5e1;
      padding: 0.65rem 0.85rem;
      text-align: left;
    }
    .job-content th {
      background-color: #f1f5f9;
      font-weight: 600;
    }
    .job-content a {
      color: #2563eb;
      text-decoration: underline;
    }
  </style>

  {% if page.layout == 'post' %}
    {% include schema.html %}
  {% endif %}
</head>
