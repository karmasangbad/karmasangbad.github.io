# Site Settings
title: "KarmaSangbad - All India Govt Job News & Sarkari Recruitment"
description: "Daily All India Government Job Updates, Sarkari Result, Central & State Recruitment Notifications, UPSC, SSC, Railways, Banking, Defence, and Direct Online Apply Links."
url: "https://karmasangbad.github.io" # Your live GitHub Pages URL
baseurl: "" # Leave empty if using custom domain or username.github.io

# Author & Contact
author:
  name: "KarmaSangbad Team"
  email: "contact@karmasangbad.com"
  telegram: "https://t.me/your_telegram_channel"
  whatsapp: "https://whatsapp.com/channel/your_channel"
  facebook: "https://www.facebook.com/profile.php?id=61596771963967"

# Build Settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Collections & Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude from processing
exclude:
  - scripts/
  - requirements.txt
  - README.md
  - .github/
  - .gitignore
